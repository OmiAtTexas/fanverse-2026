version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fanverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fanverse
      POSTGRES_PASSWORD: fanverse_dev
      POSTGRES_DB: fanverse_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fanverse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fanverse_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fanverse:fanverse_dev@postgres:5432/fanverse_2026
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fanverse_web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
